[package]
name    = "binalyst-zk-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "binalyst-zk-host"
path = "src/main.rs"

[dependencies]
# RISC Zero host SDK — full std features (this runs on the host, not in zkVM)
risc0-zkvm  = { version = "1.1", features = ["std", "prove"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"

# Include the guest ELF + image_id at compile time
[build-dependencies]
risc0-build = { version = "1.1" }
