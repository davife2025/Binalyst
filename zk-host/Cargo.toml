[package]
name    = "binalyst-zk-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "binalyst-zk-host"
path = "src/main.rs"

[dependencies]
risc0-zkvm  = { version = "1.1", features = ["std", "prove"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
bincode     = "1"          # receipt serialisation
base64      = "0.21"       # base64 encoding for receiptB64

[build-dependencies]
risc0-build = { version = "1.1" }
