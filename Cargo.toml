[workspace]
members  = ["zk-guest"]
resolver = "2"

# Pin risc0 toolchain version used across the workspace.
# Run `cargo risczero install` once after cloning.
[workspace.dependencies]
risc0-zkvm  = { version = "1.1", features = ["std"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
