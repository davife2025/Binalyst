[workspace]
members  = ["zk-guest", "zk-host"]
resolver = "2"

[workspace.dependencies]
risc0-zkvm  = { version = "1.1", features = ["std"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"

# risc0-build is only needed by the host crate's build.rs
# The guest crate does NOT list it — it has no build.rs.
risc0-build = { version = "1.1" }
